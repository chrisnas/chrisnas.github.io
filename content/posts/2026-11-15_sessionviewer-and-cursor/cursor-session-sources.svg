<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cursor session source files</title>
  <desc id="desc">Cursor agent transcripts, Desktop SQLite stores with WAL files and workspace manifests, and plan files.</desc>
  <defs>
    <style>
      .background{fill:#f1f5f9}.panel{fill:#f8fafc;stroke:#64748b;stroke-width:2}.box{fill:#fff;stroke:#2563eb;stroke-width:2}.aux{fill:#eff6ff;stroke:#64748b;stroke-width:2}
      .title{font:700 24px system-ui,sans-serif;fill:#0f172a}.label{font:600 17px system-ui,sans-serif;fill:#0f172a}.path{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#334155}
      .line{fill:none;stroke:#64748b;stroke-width:2}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect class="background" width="1200" height="680"/>
  <rect class="panel" x="30" y="30" width="1140" height="280" rx="16"/>
  <text class="title" x="60" y="70">Agent transcripts</text>
  <text class="path" x="60" y="98">%USERPROFILE%\.cursor\projects\&lt;project&gt;\agent-transcripts\</text>
  <rect class="box" x="70" y="125" width="330" height="72" rx="10"/>
  <text class="label" x="90" y="154">Nested main transcript</text><text class="path" x="90" y="180">&lt;session&gt;\&lt;session&gt;.jsonl</text>
  <rect class="box" x="455" y="125" width="330" height="72" rx="10"/>
  <text class="label" x="475" y="154">Subagent transcripts</text><text class="path" x="475" y="180">&lt;session&gt;\subagents\*.jsonl</text>
  <path class="line" d="M400 161H455"/>
  <rect class="aux" x="70" y="220" width="330" height="62" rx="10"/>
  <text class="label" x="90" y="248">Legacy main transcript</text><text class="path" x="90" y="271">&lt;session&gt;.jsonl</text>
  <path class="line dash" d="M235 220V197"/>

  <rect class="panel" x="30" y="335" width="790" height="315" rx="16"/>
  <text class="title" x="60" y="375">Cursor Desktop storage</text>
  <text class="path" x="60" y="403">%APPDATA%\Cursor\User\</text>
  <rect class="box" x="70" y="435" width="330" height="72" rx="10"/>
  <text class="label" x="90" y="464">Global Composer database</text><text class="path" x="90" y="490">globalStorage\state.vscdb</text>
  <rect class="aux" x="455" y="435" width="300" height="72" rx="10"/>
  <text class="label" x="475" y="464">Write-ahead log</text><text class="path" x="475" y="490">state.vscdb-wal</text>
  <path class="line" d="M400 471H455"/>
  <rect class="box" x="70" y="540" width="330" height="72" rx="10"/>
  <text class="label" x="90" y="569">Workspace Composer database</text><text class="path" x="90" y="595">workspaceStorage\&lt;id&gt;\state.vscdb</text>
  <rect class="aux" x="455" y="540" width="300" height="72" rx="10"/>
  <text class="label" x="475" y="569">Workspace manifest</text><text class="path" x="475" y="595">&lt;id&gt;\workspace.json maps root</text>
  <path class="line" d="M400 576H455"/>

  <rect class="panel" x="850" y="335" width="320" height="315" rx="16"/>
  <text class="title" x="880" y="375">Plans</text>
  <text class="path" x="880" y="403">%USERPROFILE%\.cursor\plans\</text>
  <rect class="box" x="880" y="435" width="260" height="72" rx="10"/>
  <text class="label" x="900" y="464">Plan document</text><text class="path" x="900" y="490">*.plan.md</text>
</svg>
